methods: "Gradient boosting quantile regression fit to NSSP ED visit data, supplemented with NHSN, ILINet, and FluSurv-NET, with added directional wave spatial features."
methods_long: "
  Gradient boosting quantile regression, with NSSP emergency department visit data as the main source.
  NHSN hospitalizations, ILINet outpatient illness percentages, and FluSurv-NET hospitalization rates are included as supplementary training sources.
  Directional wave features (all 8 compass directions) added to capture spatial spread patterns across locations.
"
data_inputs: "Weekly percentage of emergency department visits with a diagnosis of influenza, from NSSP. Weekly incident laboratory-confirmed influenza hospitalizations from NHSN. Outpatient influenza-like illness percentage from ILINet. Laboratory-confirmed influenza hospitalization rates from FluSurv-NET."
ensemble_of_models: false
