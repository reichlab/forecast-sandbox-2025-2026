methods: "Ensemble of statistical and machine learning time series models with spatial features."
data_inputs: "Weekly incident flu hospitalizations from NHSN, NSSP, FluSurv-NET, and ILINet."
methods_long: "
  A quantile average (median ensemble) of two models:
   1. Gradient boosting quantile regression fit with NHSN as the main source and
   NSSP, FluSurv-NET, and ILINet as supplementary sources, with directional wave
   spatial features. The spatial features capture disease spread patterns across
   geographic directions using 8 directional waves with temporal lags of 1 and 2
   weeks, maximum distance of 1500km, and both velocity and aggregate features.
   2. An AR(6) model fit to NHSN only with shared Fourier seasonality terms in
   addition to shared AR coefficients and per-location variance parameters.

  The spatial features are only present in state-level forecasts, since directional
  wave features only support a single aggregation level. For US-level forecasts,
  the non-spatial gbqr_4src model (same NHSN main source plus NSSP/FluSurv-NET/ILINet
  supplementary sources) is used in place of gbqr_4src_spatial.

  Both component models apply fourth root power transformation to hospitalization
  data. The ensemble combines quantile forecasts from both models using the median
  across models.
  "
