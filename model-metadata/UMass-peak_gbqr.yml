designated_model: true
methods: "LightGBM quantile regression (peak size) and multiclass classification (peak timing) on state features of the season so far, trained on NHSN, ILINet and FluSurv-NET seasons."
methods_long: "
  Direct model for peak week inc flu hosp and peak inc flu hosp (FluSight designated_targets: both peak targets). Each historical season is replayed week by week; scale-free state features (current level relative to the running maximum, weeks since the maximum, 1-3 week log growth, cumulative incidence, national features, level relative to previous peaks) predict (i) quantiles of z, the remaining log growth of the running maximum, with LightGBM pinball-loss regressions and (ii) the number of weeks until the peak (already peaked, 1..12, >12) with a LightGBM multiclass classifier, the >12 class being spread by climatology. Both are bagged over 25 random 70% subsets of training seasons. Training uses NHSN, ILINet x WHO-NREVSS percent positive and FluSurv-NET seasons before the forecast season.
  Backfill adjustment: revisions to the most recent 10 weeks of NHSN counts are simulated by resampling historical revision vectors (log ratio of final to first-reported counts) estimated from NHSN data vintages; features and predictions are recomputed for each of 200 simulated revised series and averaged, which puts probability on past weeks that could be revised to become the peak. Every peak-week probability is floored at 1e-4.
"
data_inputs: "NHSN weekly laboratory-confirmed influenza hospital admissions (with data vintages); ILINet weighted ILI x WHO-NREVSS percent positive; FluSurv-NET hospitalization rates."
ensemble_of_models: false
ensemble_of_hub_models: false
