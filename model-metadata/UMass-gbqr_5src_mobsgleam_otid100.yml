methods: "Gradient boosting quantile regression fit to NHSN, NSSP, ILINet, FluSurv-NET data, augmented with SMH synthetic trajectories from the MOBS_NEU-GLEAM_FLU model (n=100 sampled output_type_ids)."
methods_long: "
  Gradient boosting quantile regression, fit to NHSN, NSSP, ILINet, FluSurv-NET data.
  Supplemented with synthetic weekly incident hospitalization trajectories from rounds 4, 5, and 6 of the Flu Scenario Modeling Hub, filtered to the MOBS_NEU-GLEAM_FLU model.
  Output_type_ids (trajectory samples) are randomly sampled to n=100 per (round, location) group, using a fixed seed (42) for reproducibility.
"
data_inputs: "Weekly incident laboratory-confirmed influenza hospitalizations from NHSN. Weekly percentage of emergency department visits with an influenza diagnosis from NSSP. Weekly percentage of outpatient visits for influenza-like illness from ILINet. Weekly influenza hospitalization surveillance rates from FluSurv-NET. Synthetic weekly incident hospitalization trajectories from rounds 4, 5, and 6 of the Flu Scenario Modeling Hub, filtered to the MOBS_NEU-GLEAM_FLU model (n=100 sampled output_type_ids)."
ensemble_of_models: false
ensemble_of_hub_models: false
