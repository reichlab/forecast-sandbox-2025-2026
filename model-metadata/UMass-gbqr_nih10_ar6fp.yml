methods: "Equally weighted quantile average of UMass-gbqr_5src_nihflu_otid10 and UMass-AR6_fourierP_thetaP."
data_inputs: "Weekly incident flu hospitalizations from NHSN; NSSP ED visits; ILINet; FluSurv-NET; Flu Scenario Modeling Hub NIH-Flu_TS synthetic trajectories."
methods_long: "
  Equally weighted quantile average (hubEnsembles::simple_ensemble) of two existing hub models:
   1. UMass-gbqr_5src_nihflu_otid10: gradient boosting quantile regression fit to NHSN, NSSP, ILINet, and FluSurv-NET data, augmented with Flu SMH NIH-Flu_TS synthetic trajectories (n=10).
   2. UMass-AR6_fourierP_thetaP: an AR(6) model with K=2 Fourier seasonality, AR and Fourier parameters pooled across locations (fourth-root scale).
  No additional model fitting; built from the component model-output files by src/gbqr_ar_ensembles.
  "
ensemble_of_models: true
ensemble_of_hub_models: true
