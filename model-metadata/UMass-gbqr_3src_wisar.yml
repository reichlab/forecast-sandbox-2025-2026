methods: "Equally weighted quantile average of UMass-gbqr_3src and UMass-WISAR6_fourthroot_adaptive_t."
data_inputs: "Weekly incident flu hospitalizations from NHSN; ILINet; FluSurv-NET."
methods_long: "
  Equally weighted quantile average (hubEnsembles::simple_ensemble) of two existing hub models:
   1. UMass-gbqr_3src: gradient boosting quantile regression fit to NHSN, FluSurv-NET, and ILINet data.
   2. UMass-WISAR6_fourthroot_adaptive_t: a WIS-loss AR(6) with Fourier seasonality, adaptive priors, and Student-t innovations (fourth-root scale).
  No additional model fitting; built from the component model-output files by src/gbqr_ar_ensembles.
  "
ensemble_of_models: true
ensemble_of_hub_models: true
