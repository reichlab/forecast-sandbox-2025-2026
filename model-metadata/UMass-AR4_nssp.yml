methods: "Bayesian autoregressive (AR order 4) model fit to NSSP ED visit data, with AR coefficients pooled across locations."
methods_long: "
  SARIX (Bayesian ARIMA with exogenous covariates) model with autoregressive order p=4, fit to NSSP emergency department visit data.
  Theta (AR coefficient) parameters are pooled (shared) across locations, with no Fourier seasonality terms.
"
