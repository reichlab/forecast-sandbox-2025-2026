methods: "Gradient boosting quantile regression fit jointly to all locations on NHSN, FluSurv-NET, and ILINet data."
data_inputs: "Weekly incident flu hospitalizations from NHSN; FluSurv-NET; ILINet."
methods_long: "
  Gradient boosting quantile regression with standard flusion options (100 bags, fourth-root transform),
  fit jointly to all 53 locations on NHSN, FluSurv-NET, and ILINet data. Same configuration as the
  gbqr_3src component of UMass-flusion_spatial2_prod; supplies the national (US) GBQR forecast for the
  gbqr_3src_spatial x AR ensembles. Run with idmodels v2.1.0.
  "
