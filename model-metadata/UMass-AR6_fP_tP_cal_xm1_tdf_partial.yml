methods: "AR6_fourierP_thetaP_cal_xm1 with Student's t innovations; degrees of freedom: one value per location, partially pooled toward a common value."
data_inputs: "Weekly incident flu hospitalizations from NHSN."
methods_long: "
  AR6_fourierP_thetaP_cal_xm1 (Fourier seasonality with K = 2 harmonics and holiday effects for the week before
  Christmas week and the Christmas and New Year's weeks, all shared across locations) with Student's t innovations
  instead of normal ones. The t is standardized so that sigma is the innovation standard deviation, with degrees of
  freedom above 2 (one value per location, partially pooled toward a common value). Uses development versions of sarix (t innovations, reichlab/sarix PR 18)
  and idmodels (reichlab/idmodels PR 48). Code: src/AR6_fourierP_holiday_t (variant tdf_partial).
  "
