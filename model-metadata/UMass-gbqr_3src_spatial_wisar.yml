designated_model: true
methods: "Equally weighted quantile average of UMass-gbqr_3src_spatial (UMass-gbqr_3src for US) and UMass-WISAR6_fourthroot_adaptive_t."
data_inputs: "Weekly incident flu hospitalizations from NHSN; ILINet; FluSurv-NET."
methods_long: "
  Equally weighted quantile average (hubEnsembles::simple_ensemble) of two existing hub models:
   1. UMass-gbqr_3src_spatial: gradient boosting quantile regression fit to NHSN, FluSurv-NET, and ILINet data, with directional wave spatial features. Its spatial features are state-level only, so for the US forecast UMass-gbqr_3src (the same model without spatial features) is used instead, as in UMass-flusion_3src_spatial.
   2. UMass-WISAR6_fourthroot_adaptive_t: a WIS-loss AR(6) with Fourier seasonality, adaptive priors, and Student-t innovations (fourth-root scale).
  No additional model fitting; built from the component model-output files by src/gbqr_ar_ensembles. Completes the set of spatial GBQR x AR ensembles with UMass-flusion_3src_spatial (AR6_pooled) and UMass-flusion_3src_spatial_fourierP (AR6_fourierP_thetaP).
  "
ensemble_of_models: true
ensemble_of_hub_models: true
