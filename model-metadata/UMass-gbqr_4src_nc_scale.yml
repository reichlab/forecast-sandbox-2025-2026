methods: "Gradient boosting quantile regression fit to NHSN, NSSP, ILINet and FluSurv-NET data; nowcast: scale by completeness."
data_inputs: "Weekly NHSN influenza hospitalizations, NSSP percent of ED visits for influenza, ILINet and FluSurv-NET. Data on hospitals reporting come from the Delphi Epidata archive."
methods_long: "
  Gradient boosting quantile regression fit to NHSN, NSSP, ILINet and FluSurv-NET data, with the settings of the sandbox model gbqr_4src, run with idmodels commit 9dc7f48.
  Before fitting, the newest NHSN week of each location is divided by its completeness: the number of hospitals reporting that week divided by the usual number (the median over the 2-4 weeks before it), both as of the Wednesday release the data come from (from the Delphi Epidata archive). Completeness is clipped to [0.05, 1]. Part of a retrospective comparison of nowcasting methods for the 2025/26 season
  (src/nowcast_models; idmodels issue #34).
  "
