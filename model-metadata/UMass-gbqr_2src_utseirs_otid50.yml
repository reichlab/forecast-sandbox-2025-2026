methods: "Gradient boosting quantile regression fit to NHSN data, augmented with SMH synthetic trajectories from the UT-ImmunoSEIRS model (n=50 sampled output_type_ids)."
methods_long: "
  Gradient boosting quantile regression, fit to NHSN data.
  Supplemented with synthetic weekly incident hospitalization trajectories from rounds 4, 5, and 6 of the Flu Scenario Modeling Hub, filtered to the UT-ImmunoSEIRS model.
  Output_type_ids (trajectory samples) are randomly sampled to n=50 per (round, location) group, using a fixed seed (42) for reproducibility.
"
data_inputs: "Weekly incident laboratory-confirmed influenza hospitalizations from NHSN. Synthetic weekly incident hospitalization trajectories from rounds 4, 5, and 6 of the Flu Scenario Modeling Hub, filtered to the UT-ImmunoSEIRS model (n=50 sampled output_type_ids)."
