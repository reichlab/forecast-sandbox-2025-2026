methods: "AR6_fourierP_thetaP (Fourier seasonality, K = 2, shared across locations) with multiplicative effects for the week before Christmas week and Christmas and New Year's weeks, shared across locations."
data_inputs: "Weekly incident flu hospitalizations from NHSN."
methods_long: "
  AR6_fourierP_thetaP (Fourier seasonality with K = 2 harmonics; Fourier and AR coefficients shared across locations)
  with multiplicative effects for the week before Christmas week and the Christmas and New Year's weeks, one effect per
  week shared by all locations, as in AR6_pooled_cal_xm1. Holiday effects use calendar effects from a development
  version of sarix (reichlab/sarix PR 17). Code: src/AR6_pooled_holiday (variant fp_xm1).
  "
