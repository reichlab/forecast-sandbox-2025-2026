methods: "Median ensemble of AR4_fourierP_thetaP_nssp and gbqr_2src_ilinet_nssp, both fit to NSSP ED visit data."
methods_long: "
  A simple median ensemble combining two component models' quantile forecasts: an AR(4) SARIX model with Fourier seasonality (K=2) and both theta and Fourier parameters pooled across locations, and a GBQR model supplemented with ILINet outpatient illness data.
"
data_inputs: "Weekly percentage of emergency department visits with a diagnosis of influenza, from NSSP, plus whichever supplementary surveillance sources the component models use."
