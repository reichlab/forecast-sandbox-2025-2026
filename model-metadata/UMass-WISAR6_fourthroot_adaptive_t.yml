license: "CC-BY-4.0"
designated_model: true
methods: "WIS-loss AR(6) with Fourier seasonality fit jointly to all locations on the fourth-root scale, with learned prior scales and Student-t (df=5) innovations."
data_inputs: "Weekly incident flu hospitalizations from NHSN."
methods_long: "
  This is an AR(6) model with Fourier regression terms for seasonality, fit
  jointly to all locations using Bayesian methods. Prior to model estimation,
  we perform the following three data transformations:
   1. Convert hospitalization counts to a rate per 100,000 population.
   2. Take the fourth root of (rate + 0.01).
   3. Scale and center, dividing by the 95th percentile of in-season weekly
      values for the given location and subsequently subtracting the mean.
  Predictions on the transformed scale are converted back to predictions on
  the original scale by inverting these transformations.
  Annual seasonality is modeled with K=2 Fourier harmonics (sine and cosine
  terms with a period of 365.25 days). AR and Fourier coefficients are
  shared across all locations, while the innovation scale is
  location-specific. Innovations follow a Student-t distribution with 5
  degrees of freedom, scaled by the location-specific sigma.
  Prior scales are learned from the data: sigma ~ HalfCauchy(1) for each
  location, AR coefficients phi ~ Normal(0, theta_sd) with theta_sd ~
  HalfCauchy(1), and Fourier coefficients ~ Normal(0, fourier_beta_sd) with
  fourier_beta_sd ~ HalfCauchy(1).
  Instead of a likelihood, parameters are estimated with a generalized
  Bayesian (Gibbs) posterior (Bissiri, Holmes, & Walker 2016) whose loss is
  the Weighted Interval Score at the FluSight hub's 23 quantile levels, so
  the model is fit to the same metric its forecasts are evaluated on.
  The model is implemented in PyMC. Forecasts are generated by Monte Carlo
  simulation of the AR(6) recursion forward from posterior parameter draws.
  "
ensemble_of_models: false
ensemble_of_hub_models: false
