methods: "Bayesian autoregressive (AR order 2) model with Fourier seasonality (K=2), fit to NSSP ED visit data, with AR coefficients pooled across locations."
methods_long: "
  SARIX (Bayesian ARIMA with exogenous covariates) model with autoregressive order p=2, fit to NSSP emergency department visit data.
  K=2 Fourier harmonic pairs are added to capture annual seasonality. Theta (AR coefficient) parameters are pooled (shared) across locations.
"
data_inputs: "Weekly percentage of emergency department visits with a diagnosis of influenza, from NSSP."
