methods: "Gradient boosting quantile regression fit to NHSN data, augmented with SMH synthetic trajectories from all available SMH models (n=25 sampled per model)."
methods_long: "
  Gradient boosting quantile regression, fit to NHSN data.
  Supplemented with synthetic weekly incident hospitalization trajectories from rounds 4, 5, and 6 of the Flu Scenario Modeling Hub, using all available SMH models.
  Output_type_ids (trajectory samples) are randomly sampled independently for each SMH model, to n=25 per (round, location) group, using a fixed seed (42) for reproducibility.
"
data_inputs: "Weekly incident laboratory-confirmed influenza hospitalizations from NHSN. Synthetic weekly incident hospitalization trajectories from rounds 4, 5, and 6 of the Flu Scenario Modeling Hub, using all available SMH models (n=25 sampled per model)."
