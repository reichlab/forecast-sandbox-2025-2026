designated_model: true
methods: "An AR(6) model fit jointly to all locations with shared AR parameters; nowcast: scale by completeness x state."
data_inputs: "Weekly incident flu hospitalizations from NHSN. Data on hospitals reporting come from the Delphi Epidata archive."
methods_long: "
  An AR(6) model fit jointly to all locations with shared AR parameters, with the settings of the sandbox model AR6_pooled, run with idmodels commit 9dc7f48.
  Before fitting, the newest NHSN week of each location is divided by its completeness (as in the nc_scale variant) and then corrected by a factor for the location: the mean of log((settled + 1) / (scaled + 1)) over the location's settled weeks this season (at least 4 weeks old), each taken from the release in which it was the newest week, shrunk toward 0 by n / (n + 10). The factors are learned at each run from the Delphi Epidata archives of NHSN admissions and hospitals reporting, as published by then. Part of a retrospective comparison of nowcasting methods for the 2025/26 season
  (src/nowcast_models; idmodels issue #34).
  "
ensemble_of_models: false
